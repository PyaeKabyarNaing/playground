<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppies Are Forever, Not Just For Christmas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="scene" id="scene">
            <div class="curtain" id="curtain">
                <img src="img/curtainleft.png" class="curtain-left" id="curtain-left" alt="">
                <img src="img/curtainright.png" class="curtain-right" id="curtain-right" alt="">
            </div>

            <div class="btnFrame">
                <img src="img/pole.png" class="pole" id="pole" alt="">
                <img src="img/pole.png" class="pole" id="pole1" alt="">
                <img src="img/pole.png" class="pole" id="pole2" alt="">
                <img src="img/pole.png" class="pole" id="pole3" alt="">
                <button class="btn" id="btn-winter">Season Change</button>
            </div>
            <img src="img/winter.png" class="bg" alt="">
            <img src="img/pup.png" alt="" class="pup" id="pup">
        </div>

        <div class="scene hidden" id="scene1">
            <div class="btnFrame">
                <img src="img/butterfly.png" class="butterfly" alt="">
                <img src="img/flower4.png" class="flower4" alt="">
                <button class="btn" id="btn-spring">Season Change</button>
            </div>
            <img src="img/spring.png" class="bg" alt="">
            <img src="img/pup1.png" alt="" class="pup" id="pup1">
            <img src="img/butterfly1.png" alt="" class="butterfly1" id="butterfly1">
            <img src="img/butterfly2.png" alt="" class="butterfly2" id="butterfly2">
        </div>

        <div class="scene hidden" id="scene2">
            <div class="btnFrame">
                <img src="img/flower.png" class="flower" alt="">
                <img src="img/leaf.png" class="leaf" alt="">
                <img src="img/flower1.png" class="flower1" alt="">
                <img src="img/flower2.png" class="flower2" alt="">
                <img src="img/leaf1.png" class="leaf1" alt="">
                <img src="img/flower3.png" class="flower3" alt="">
                <button class="btn" id="btn-summer">Season Change</button>
            </div>
            <img src="img/summer.png" class="bg" alt="">
            <img src="img/pup2.png" alt="" class="pup" id="pup2">
            <img src="img/flower5.png" alt="" class="flower5 flowerFall fall1" id="flower5">
            <img src="img/flower6.png" alt="" class="flower5 flowerFall fall2" id="flower6">
            <img src="img/flower7.png" alt="" class="flower5 flowerFall fall3" id="flower7">
            <img src="img/flower8.png" alt="" class="flower5 flowerFall fall4" id="flower8">
            <img src="img/flower9.png" alt="" class="flower5 flowerFall fall5" id="flower9">
        </div>

        <div class="scene hidden" id="scene3">
            <div class="btnFrame">
                <button class="btn" id="btn-autumn">Season Change</button>
                <img src="img/ladybug.png" class="ladybug" alt="">
                <img src="img/maple.png" class="maple" alt="">
            </div>
            <img src="img/autumn.png" class="bg" alt="">
            <img src="img/pup3.png" class="pup" id="pup3" alt="">

            <img src="img/maple1.png" alt="" class="flower5 flowerFall fall1" id="maple1">
            <img src="img/maple2.png" alt="" class="flower5 flowerFall fall2" id="maple2">
            <img src="img/maple3.png" alt="" class="flower5 flowerFall fall3" id="maple3">
            <img src="img/maple4.png" alt="" class="flower5 flowerFall fall4" id="maple4">
            <img src="img/maple5.png" alt="" class="flower5 flowerFall fall5" id="maple5">
        </div>

        <div class="scene hidden" id="scene4">
            <span class="text">Puppies Are Forever, Not Just For Christmas ❤️</span>
            <div class="btnFrame">
                <button class="btn" id="btn-img">Season Change</button>
                <img src="img/sunflower.png" class="sunflower" alt="">
                <div class="sun"></div>
            </div>
            <img src="img/img.png" class="bg" alt="">
            <img src="img/pup4.png" class="pup" id="pup4" alt="">

            <img src="img/leaf2.png" alt="" class="flower5 flowerFall fall1" id="leaf2">
            <img src="img/leaf3.png" alt="" class="flower5 flowerFall fall2" id="leaf3">
            <img src="img/leaf4.png" alt="" class="flower5 flowerFall fall3" id="leaf4">
            <img src="img/leaf5.png" alt="" class="flower5 flowerFall fall4" id="leaf5">
            <img src="img/leaf6.png" alt="" class="flower5 flowerFall fall5" id="leaf6">
        </div>

        <audio src="Sia - Puppies Are Forever.mp3" id="audio"></audio>
    
    <script src="script.js"></script>
</body>
</html>
